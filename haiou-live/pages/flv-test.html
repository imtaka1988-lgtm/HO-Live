<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>FLV 测试页</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/assets/vendor/flv.min.js"></script>
  <style>
    body { margin:0; padding:24px; font-family:Arial,"Microsoft YaHei",sans-serif; background:#111827; color:#fff; }
    .box { max-width:900px; margin:0 auto; }
    h1 { font-size:24px; }
    input { width:100%; height:42px; box-sizing:border-box; padding:0 12px; border-radius:8px; border:1px solid #ddd; margin:12px 0; }
    button { height:42px; padding:0 20px; border:0; border-radius:8px; background:#facc15; color:#111; font-weight:800; cursor:pointer; }
    video { width:100%; height:500px; background:#000; margin-top:16px; }
    pre { background:#000; color:#10b981; padding:12px; min-height:120px; white-space:pre-wrap; }
  </style>
</head>
<body>
  <div class="box">
    <h1>FLV 测试页</h1>
    <p>这里只测试 FLV，不影响正式直播间。</p>

    <input id="url" value="https://haiolive.cn/live/room_1.flv">
    <button id="btn">开始测试 FLV</button>

    <video id="video" controls autoplay muted playsinline></video>

    <h3>日志</h3>
    <pre id="log"></pre>
  </div>

  <script>
    var player = null;
    var logEl = document.getElementById('log');

    function log(msg) {
      logEl.textContent += msg + "\n";
      console.log(msg);
    }

    document.getElementById('btn').onclick = function () {
      var url = document.getElementById('url').value.trim();
      var video = document.getElementById('video');

      logEl.textContent = '';
      log('flvjs loaded: ' + !!window.flvjs);
      log('flvjs supported: ' + (window.flvjs && flvjs.isSupported()));
      log('url: ' + url);

      if (player) {
        try {
          player.pause();
          player.unload();
          player.detachMediaElement();
          player.destroy();
        } catch(e) {}
        player = null;
      }

      if (!window.flvjs || !flvjs.isSupported()) {
        log('当前浏览器不支持 flv.js');
        return;
      }

      try {
        player = flvjs.createPlayer({
          type: 'flv',
          url: url,
          isLive: true,
          cors: true
        }, {
          enableWorker: false,
          lazyLoad: false,
          stashInitialSize: 128
        });

        player.attachMediaElement(video);
        player.load();

        player.play().then(function () {
          log('FLV play success');
        }).catch(function (err) {
          log('FLV play failed: ' + err.message);
        });

        player.on(flvjs.Events.ERROR, function (type, detail, info) {
          log('FLV ERROR type=' + type + ' detail=' + detail);
          if (info) log(JSON.stringify(info));
        });
      } catch (e) {
        log('初始化失败：' + e.message);
      }
    };
  </script>
</body>
</html>
