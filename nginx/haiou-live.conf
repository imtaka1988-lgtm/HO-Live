# 海鸥直播 - Nginx 配置
server {
    server_name s6.lol www.s6.lol;

    root /var/www/haiou-live;
    index index.html;

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP 防 XSS：只保留本站与必要的通用资源类型，不再允许未知外部脚本域名
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:; font-src 'self'; frame-src 'self'; child-src 'self'" always;

    # 404
    error_page 404 /404.html;

    # 首页标准化：/index.html 永久跳转到根路径，避免首页重复 URL
    location = /index.html {
        return 301 https://www.s6.lol/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # JS/CSS 开发期不强缓存，避免后台改了前台还是旧代码
    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # 图片和字体继续缓存
    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /assets/vendor/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /assets/data/site-config.json {
        add_header Cache-Control "no-store";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/s6.lol/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/s6.lol/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


    # WebSocket proxy to Node.js backend
    location /ws/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # API proxy to Node.js backend
    location /api/ {
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    if ($host = www.s6.lol) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = s6.lol) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name s6.lol www.s6.lol;
    return 404; # managed by Certbot



}
