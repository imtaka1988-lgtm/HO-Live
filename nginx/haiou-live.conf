# 海鸥直播 - Nginx 配置
server {
    server_name s6.lol www.s6.lol;

    root /var/www/haiou-live;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Transport and browser security
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:; font-src 'self'; frame-src 'self'; child-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    error_page 404 /404.html;

    # Avoid duplicate home URLs while keeping the configuration portable to a new domain.
    location = /index.html {
        return 301 $scheme://$host/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML should revalidate so deployments appear immediately.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri /index.html;
    }

    # Source filenames are not content-hashed yet, so use a short safe cache.
    location ~* \.(css|js)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400";
    }

    # Versioned/vendor assets can be cached longer.
    location ^~ /assets/vendor/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Uploaded files use random names and are safe for immutable caching.
    location ^~ /uploads/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /assets/data/site-config.json {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # Do not expose dotfiles, backups, archives, logs, or environment files.
    location ~ /\.(?!well-known/) {
        deny all;
        return 404;
    }
    location ~* \.(?:env|log|sql|bak|old|orig|tar|gz|zip)$ {
        deny all;
        return 404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/s6.lol/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/s6.lol/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    location /ws/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
    }

    location /api/ {
        client_max_body_size 7m;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name s6.lol www.s6.lol;
    return 301 https://$host$request_uri;
}
