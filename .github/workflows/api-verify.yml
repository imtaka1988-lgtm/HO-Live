name: API Verify

on:
  push:
    branches:
      - main
      - "chore/**"
    paths:
      - "haiou-api/**"
      - ".github/workflows/api-verify.yml"
  pull_request:
    paths:
      - "haiou-api/**"
      - ".github/workflows/api-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: haiou-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: haiou-api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify
        env:
          JWT_SECRET: test-secret-that-is-longer-than-thirty-two-characters
        run: npm run verify
