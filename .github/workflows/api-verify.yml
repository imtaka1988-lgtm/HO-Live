name: API Verify

on:
  push:
    branches:
      - main
      - "chore/**"
    paths:
      - "haiou-api/**"
      - ".github/workflows/api-verify.yml"
  pull_request:
    paths:
      - "haiou-api/**"
      - ".github/workflows/api-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: haiou-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: haiou-api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify
        env:
          JWT_SECRET: test-secret-that-is-longer-than-thirty-two-characters
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee verify.log
      - name: Build audit snapshot
        if: always()
        run: |
          tar --exclude=node_modules --exclude=.env --exclude=verify.log -czf ../haiou-api-audit-source.tgz .
      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-verification-log-${{ github.run_id }}
          path: haiou-api/verify.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload audit source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haiou-api-audit-source-${{ github.run_id }}
          path: haiou-api-audit-source.tgz
          if-no-files-found: error
          retention-days: 1
