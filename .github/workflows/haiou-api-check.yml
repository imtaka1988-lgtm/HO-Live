name: Haiou API Check

on:
  pull_request:
    paths:
      - 'haiou-api/**'
      - '.github/workflows/haiou-api-check.yml'
  push:
    branches:
      - main
    paths:
      - 'haiou-api/**'
      - '.github/workflows/haiou-api-check.yml'

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: haiou-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check
